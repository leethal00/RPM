name: Fix LED calculator

on:
  push:
    branches: [stu-dev]
    paths:
      - '.github/workflows/fix-led-calculator.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Correct LED sizing logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/costing/cost-sheet.tsx')
          s = p.read_text()
          s = s.replace('const LED_LOADING = 1.2          // fixed 20% "fuck factor" — keeps drivers ≤ 80% load\nconst MODULES_PER_HOUR = 25\nconst isWiringLabour = (l: CostingLine) => l.description.toLowerCase().includes("wiring labour")', '''const MODULES_PER_HOUR = 20
const isWiringLabour = (l: CostingLine) => l.description.toLowerCase().includes("wiring labour")
const isLedDriver = (l: CostingLine) => {
    const description = l.description.toLowerCase()
    return /hlg-\\d+h/.test(description) || description.includes("driver") || description.includes("transformer") || description.includes("t/x")
}
const isLedModule = (l: CostingLine) => {
    const description = l.description.toLowerCase()
    return !isLedDriver(l) && !isWiringLabour(l) && description.includes("module")
}
const driverRatedWatts = (l: CostingLine) => {
    const modelRating = l.description.match(/HLG-(\\d+)H/i)?.[1]
    return modelRating ? Number(modelRating) : Number(l.watts ?? 0)
}''')
          s = s.replace('const modLines = isWiring ? secLines.filter((l) => l.subsection === "Modules") : []\n                const ledLoad = modLines.reduce((s, l) => s + Number(l.qty) * Number(l.watts ?? 0), 0)\n                const ledRequired = ledLoad * LED_LOADING\n                const driverCap = isWiring ? secLines.filter((l) => l.subsection === "Transformers").reduce((s, l) => s + Number(l.qty) * Number(l.watts ?? 0), 0) : 0', 'const modLines = isWiring ? secLines.filter(isLedModule) : []\n                const ledRequired = modLines.reduce((s, l) => s + Number(l.qty) * Number(l.watts ?? 0), 0)\n                const driverCap = isWiring ? secLines.filter(isLedDriver).reduce((s, l) => s + Number(l.qty) * driverRatedWatts(l), 0) : 0')
          s = s.replace('{isWiring && (ledLoad > 0 || moduleCount > 0) && (', '{isWiring && (ledRequired > 0 || moduleCount > 0) && (')
          s = s.replace('<span>LED load <span className="font-semibold tabular-nums">{ledLoad.toFixed(1)}w</span> × 1.2 = <span className="font-semibold text-foreground tabular-nums">{ledRequired.toFixed(1)}w required</span></span>', '<span>LED load <span className="font-semibold text-foreground tabular-nums">{ledRequired.toFixed(1)}w required</span></span>')
          s = s.replace('title="Set wiring labour to modules ÷ 25"', 'title="Set wiring labour to modules ÷ 20"')
          p.write_text(s)
      - name: Verify changes
        run: |
          grep -q 'const MODULES_PER_HOUR = 20' src/components/costing/cost-sheet.tsx
          grep -q 'const isLedDriver' src/components/costing/cost-sheet.tsx
          grep -q 'secLines.filter(isLedDriver)' src/components/costing/cost-sheet.tsx
          ! grep -q 'LED_LOADING' src/components/costing/cost-sheet.tsx
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/fix-led-calculator.yml
          git add src/components/costing/cost-sheet.tsx .github/workflows/fix-led-calculator.yml
          git commit -m "Fix LED load and driver sizing"
          git push origin HEAD:stu-dev
