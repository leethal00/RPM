name: Fix Xero standard quote terms

on:
  push:
    branches: [stu-dev]
    paths:
      - '.github/workflows/fix-xero-default-terms.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Pull standard terms from Xero quotes
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/app/api/xero/quotes/[id]/send/route.ts'),
              Path('src/app/api/xero/quotes/[id]/update/route.ts'),
          ]

          helper = '''\nasync function getXeroStandardQuoteTerms(accessToken: string, tenantId: string, excludeQuoteId?: string) {\n    // Xero exposes Terms on quotes, but not the organisation's default quote-terms setting.\n    // Use the most recently updated Xero quote carrying Terms as Xero's source of truth,\n    // rather than maintaining a duplicate copy in RPM.\n    const result = await xeroJson(\n        `${XERO_API}/Quotes?page=1&pageSize=100&order=${encodeURIComponent("UpdatedDateUTC DESC")}`,\n        { method: "GET" },\n        accessToken,\n        tenantId\n    )\n    const quotes = (result?.Quotes || []) as Array<{ QuoteID?: string; Terms?: string | null }>\n    const source = quotes.find((quote) => quote.QuoteID !== excludeQuoteId && quote.Terms?.trim())\n    return source?.Terms?.trim() || ""\n}\n'''

          for p in files:
              s = p.read_text()
              if 'function getXeroStandardQuoteTerms' not in s:
                  marker = 'async function findContactId('
                  s = s.replace(marker, helper + '\n' + marker)

              if p.name == 'route.ts' and '/send/' in str(p):
                  needle = '        const lines = costingLines || []\n'
                  repl = '        const standardTerms = await getXeroStandardQuoteTerms(xero.accessToken, xero.tenantId)\n        const lines = costingLines || []\n'
                  s = s.replace(needle, repl, 1)
                  needle = '                    Reference: visibleReference,\n                    LineItems: lineItems,\n'
                  repl = '                    Reference: visibleReference,\n                    ...(standardTerms ? { Terms: standardTerms } : {}),\n                    LineItems: lineItems,\n'
                  s = s.replace(needle, repl, 1)
              else:
                  needle = '        const lines = costingLines || []\n'
                  repl = '        const standardTerms = existing.Terms?.trim() || await getXeroStandardQuoteTerms(xero.accessToken, xero.tenantId, job.xero_quote_id)\n        const lines = costingLines || []\n'
                  s = s.replace(needle, repl, 1)
                  needle = '                Reference: visibleReference,\n                LineItems: lineItems,\n'
                  repl = '                Reference: visibleReference,\n                ...(standardTerms ? { Terms: standardTerms } : {}),\n                LineItems: lineItems,\n'
                  s = s.replace(needle, repl, 1)

              p.write_text(s)
          PY
      - name: Verify changes
        run: |
          grep -q 'getXeroStandardQuoteTerms' 'src/app/api/xero/quotes/[id]/send/route.ts'
          grep -q 'Terms: standardTerms' 'src/app/api/xero/quotes/[id]/send/route.ts'
          grep -q 'existing.Terms' 'src/app/api/xero/quotes/[id]/update/route.ts'
          grep -q 'Terms: standardTerms' 'src/app/api/xero/quotes/[id]/update/route.ts'
      - name: Commit fix and remove workflow
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/fix-xero-default-terms.yml
          git add 'src/app/api/xero/quotes/[id]/send/route.ts' 'src/app/api/xero/quotes/[id]/update/route.ts' .github/workflows/fix-xero-default-terms.yml
          git commit -m "Use Xero standard terms on RPM quotes"
          git push origin HEAD:stu-dev
