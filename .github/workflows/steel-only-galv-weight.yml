name: Steel-only galvanising weight fix
on:
  push:
    branches: [stu-dev]
    paths: ['.github/workflows/steel-only-galv-weight.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Keep galvanising weight steel-only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/costing/cost-sheet.tsx')
          s = p.read_text()
          old = 'const totalWeight = lines.reduce((s, l) => s + lineWeight(l), 0)'
          new = '''const totalWeight = lines.reduce((s, l) => s + lineWeight(l), 0)\n    // Galvanising must only use items in the Steel section, even when other materials carry weights.\n    const totalSteelWeight = lines.filter((l) => l.section === "Steel").reduce((s, l) => s + lineWeight(l), 0)'''
          if old not in s:
              raise SystemExit('totalWeight declaration not found')
          s = s.replace(old, new, 1)
          s = s.replace('showWeights && isGalvPerKg(l) && totalWeight > 0 && Math.abs(Number(l.qty) - totalWeight) > 0.01', 'showWeights && isGalvPerKg(l) && totalSteelWeight > 0 && Math.abs(Number(l.qty) - totalSteelWeight) > 0.01')
          s = s.replace('patchLine(l.id, { qty: Math.round(totalWeight * 100) / 100 })', 'patchLine(l.id, { qty: Math.round(totalSteelWeight * 100) / 100 })')
          s = s.replace('= {totalWeight.toFixed(1)} kg', '= {totalSteelWeight.toFixed(1)} kg')
          s = s.replace('Total weight feeds the galvanising calc — set a galvanising line&apos;s qty to it via its &quot;= kg&quot; link.', 'Total weight includes all weighted materials. Galvanising uses Steel-section weight only via the &quot;= kg&quot; link.')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'const totalSteelWeight = lines.filter((l) => l.section === "Steel")' src/components/costing/cost-sheet.tsx
          grep -q 'isGalvPerKg(l) && totalSteelWeight > 0' src/components/costing/cost-sheet.tsx
      - name: Commit
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/steel-only-galv-weight.yml
          git add src/components/costing/cost-sheet.tsx .github/workflows/steel-only-galv-weight.yml
          git commit -m "Keep galvanising calculation steel-only"
          git push origin HEAD:stu-dev
