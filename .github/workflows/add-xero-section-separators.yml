name: Add Xero section separators
on:
  push:
    branches: [stu-dev]
    paths: ['.github/workflows/add-xero-section-separators.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Add separator before every section heading
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('src/app/api/xero/quotes/[id]/send/route.ts'), Path('src/app/api/xero/quotes/[id]/update/route.ts')]:
              s=p.read_text()
              old='''            if (item.sign_code === SECTION_HEADING_CODE) {\n                sectionNumber += 1\n                return { Description: `${sectionNumber}. ${(item.name || "SECTION").trim().toUpperCase()}` }\n            }'''
              new='''            if (item.sign_code === SECTION_HEADING_CODE) {\n                sectionNumber += 1\n                return [\n                    { Description: "--" },\n                    { Description: `${sectionNumber}. ${(item.name || "SECTION").trim().toUpperCase()}` },\n                ]\n            }'''
              if old not in s:
                  raise SystemExit(f'heading block not found in {p}')
              s=s.replace(old,new,1)
              s=s.replace('pricedLineItems = items.map((item) => {','pricedLineItems = items.flatMap((item) => {',1)
              s=s.replace('pricedLineItems = (items || []).map((item) => {','pricedLineItems = (items || []).flatMap((item) => {',1)
              s=s.replace('''        const lineItems = [\n            { Description: introDescription },\n            { Description: "--" },\n            ...pricedLineItems,\n        ]''','''        const lineItems = [\n            { Description: introDescription },\n            ...pricedLineItems,\n        ]''',1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'flatMap' 'src/app/api/xero/quotes/[id]/send/route.ts'
          grep -q 'flatMap' 'src/app/api/xero/quotes/[id]/update/route.ts'
      - name: Commit
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/add-xero-section-separators.yml
          git add 'src/app/api/xero/quotes/[id]/send/route.ts' 'src/app/api/xero/quotes/[id]/update/route.ts' .github/workflows/add-xero-section-separators.yml
          git commit -m "Add separators before Xero quote sections"
          git push origin HEAD:stu-dev
