name: Add Xero customer details
on:
  push:
    branches: [stu-dev]
    paths: ['.github/workflows/add-xero-customer-details.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Add Xero contact API and customer details UI
        run: |
          mkdir -p src/app/api/xero/contacts
          cat > src/app/api/xero/contacts/route.ts <<'EOF'
          import { NextResponse } from "next/server"
          import { createClient as createServerClient } from "@/lib/supabase/server"
          import { getValidXero, XERO_API, xeroHeaders } from "@/lib/xero"

          export const dynamic = "force-dynamic"

          export async function GET() {
              const server = await createServerClient()
              const { data: auth } = await server.auth.getUser()
              if (!auth.user) return NextResponse.json({ error: "Not signed in" }, { status: 401 })
              const xero = await getValidXero()
              if (!xero) return NextResponse.json({ error: "Xero is not connected." }, { status: 409 })
              const response = await fetch(`${XERO_API}/Contacts?where=${encodeURIComponent('ContactStatus=="ACTIVE"')}&order=Name`, {
                  headers: xeroHeaders(xero.accessToken, xero.tenantId), cache: "no-store"
              })
              const body = await response.json()
              if (!response.ok) return NextResponse.json({ error: body?.Message || "Could not load Xero contacts." }, { status: response.status })
              const contacts = (body?.Contacts || []).map((c: any) => ({
                  id: c.ContactID, name: c.Name, email: c.EmailAddress || "", firstName: c.FirstName || "", lastName: c.LastName || "",
                  phones: c.Phones || [], addresses: c.Addresses || [], people: c.ContactPersons || []
              }))
              return NextResponse.json({ contacts })
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/customer-manager.tsx')
          s=p.read_text()
          s=s.replace('Loader2, Plus, Trash2, Users, Palette','Loader2, Plus, Trash2, Users, Palette, ContactRound, RefreshCw, Mail, Phone, MapPin')
          s=s.replace('const [brandManagerFor, setBrandManagerFor] = useState<Client | null>(null)','''const [brandManagerFor, setBrandManagerFor] = useState<Client | null>(null)\n    const [detailsFor, setDetailsFor] = useState<Client | null>(null)\n    const [xeroContacts, setXeroContacts] = useState<any[]>([])\n    const [xeroLoading, setXeroLoading] = useState(false)''')
          marker='''    const handleDelete = async (id: string) => {'''
          helper='''    const loadXeroContacts = async () => {\n        setXeroLoading(true)\n        try {\n            const response = await fetch("/api/xero/contacts", { cache: "no-store" })\n            const body = await response.json()\n            if (!response.ok) throw new Error(body.error || "Could not load Xero contacts")\n            setXeroContacts(body.contacts || [])\n        } catch (error) {\n            toast.error(error instanceof Error ? error.message : "Could not load Xero contacts")\n        } finally { setXeroLoading(false) }\n    }\n\n    const matchingXeroContact = detailsFor ? xeroContacts.find((c) => c.name?.toLowerCase() === detailsFor.name.toLowerCase()) : null\n\n'''
          s=s.replace(marker,helper+marker)
          old='''                                            <Button\n                                                variant="outline"\n                                                size="sm"\n                                                className="h-8 gap-1.5 text-xs"\n                                                onClick={(e) => { e.stopPropagation(); setBrandManagerFor(customer) }}\n                                            >'''
          new='''                                            <Button variant="outline" size="sm" className="h-8 gap-1.5 text-xs" onClick={(e) => { e.stopPropagation(); setDetailsFor(customer); if (!xeroContacts.length) loadXeroContacts() }}>\n                                                <ContactRound className="size-3.5" /> Details\n                                            </Button>\n                                            <Button\n                                                variant="outline"\n                                                size="sm"\n                                                className="h-8 gap-1.5 text-xs"\n                                                onClick={(e) => { e.stopPropagation(); setBrandManagerFor(customer) }}\n                                            >'''
          s=s.replace(old,new,1)
          insert='''\n            <Dialog open={!!detailsFor} onOpenChange={(open) => !open && setDetailsFor(null)}>\n                <DialogContent className="sm:max-w-[680px] max-h-[80vh] overflow-y-auto">\n                    <DialogHeader><DialogTitle>{detailsFor?.name}</DialogTitle><DialogDescription>Customer contact details are read from Xero, which remains the source of truth.</DialogDescription></DialogHeader>\n                    <div className="flex justify-end"><Button variant="outline" size="sm" className="gap-1.5" onClick={loadXeroContacts} disabled={xeroLoading}><RefreshCw className={`size-3.5 ${xeroLoading ? "animate-spin" : ""}`} /> Sync from Xero</Button></div>\n                    {xeroLoading ? <div className="py-10 text-center"><Loader2 className="size-6 animate-spin mx-auto" /></div> : matchingXeroContact ? (\n                        <div className="space-y-4 text-sm">\n                            <div className="grid gap-3 sm:grid-cols-2">\n                                <div className="rounded-md border p-3"><div className="font-medium mb-2">Primary contact</div>{matchingXeroContact.email && <div className="flex gap-2"><Mail className="size-4 mt-0.5" />{matchingXeroContact.email}</div>}{matchingXeroContact.phones?.filter((p:any)=>p.PhoneNumber).map((p:any,i:number)=><div key={i} className="flex gap-2 mt-1"><Phone className="size-4 mt-0.5" />{p.PhoneNumber}</div>)}</div>\n                                <div className="rounded-md border p-3"><div className="font-medium mb-2">Addresses</div>{matchingXeroContact.addresses?.filter((a:any)=>a.AddressLine1||a.City).map((a:any,i:number)=><div key={i} className="flex gap-2 mb-2"><MapPin className="size-4 mt-0.5 shrink-0" /><span>{[a.AddressLine1,a.AddressLine2,a.City,a.Region,a.PostalCode].filter(Boolean).join(", ")}</span></div>)}</div>\n                            </div>\n                            {!!matchingXeroContact.people?.length && <div className="rounded-md border p-3"><div className="font-medium mb-2">Contact people</div>{matchingXeroContact.people.map((person:any,i:number)=><div key={i} className="py-1">{[person.FirstName,person.LastName].filter(Boolean).join(" ")}{person.EmailAddress ? ` — ${person.EmailAddress}` : ""}</div>)}</div>}\n                        </div>\n                    ) : <div className="rounded-md border border-dashed p-5 text-sm text-muted-foreground">No exact Xero contact named <strong>{detailsFor?.name}</strong> was found. Check the customer name in Xero, then sync again.</div>}\n                </DialogContent>\n            </Dialog>\n'''
          s=s.replace('''            <Dialog open={!!brandManagerFor}''',insert+'\n            <Dialog open={!!brandManagerFor}',1)
          s=s.replace('w-[260px]','w-[360px]')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/add-xero-customer-details.yml
          git add src/app/api/xero/contacts/route.ts src/components/customer-manager.tsx .github/workflows/add-xero-customer-details.yml
          git commit -m "Add Xero customer contact details"
          git push origin HEAD:stu-dev
