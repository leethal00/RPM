name: Enable all material weights
on:
  push:
    branches: [stu-dev]
    paths: ['.github/workflows/enable-all-material-weights.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stu-dev
      - name: Make catalogue weight editable for all materials
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/quoting/catalogue/page.tsx')
          s = p.read_text()
          s = s.replace('{ key: "mtr_weight", label: "kg/unit", width: 92, min: 60, align: "right", title: "Steel: kg per metre (per sheet for plate)" },', '{ key: "mtr_weight", label: "kg/unit", width: 92, min: 60, align: "right", title: "Weight factor: kg per metre, kg per m², or kg per unit as appropriate" },')
          old = '''            case "mtr_weight": return m.section === "Steel"\n                ? <NumCell value={m.mtr_weight} placeholder="—" onCommit={(v) => patch(m.id, { mtr_weight: v })} />\n                : <span className="text-muted-foreground/40 pl-1.5">—</span>'''
          new = '''            case "mtr_weight": return <NumCell value={m.mtr_weight} placeholder="—" onCommit={(v) => patch(m.id, { mtr_weight: v })} />'''
          if old not in s:
              raise SystemExit('mtr_weight block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "WSTSTU"
          git config user.email "311196036+WSTSTU@users.noreply.github.com"
          rm .github/workflows/enable-all-material-weights.yml
          git add src/app/quoting/catalogue/page.tsx .github/workflows/enable-all-material-weights.yml
          git commit -m "Allow weight entry for all catalogue materials"
          git push origin HEAD:stu-dev
